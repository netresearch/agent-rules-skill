name: Test Scripts

# Runs the agent-rules script regression tests (e.g. the scope-index heading
# contract between generate-agents.sh and validate-structure.sh, issue #55).
# Thin caller of the shared script-check reusable, so the checkout pin and
# harden-runner are maintained centrally. The tests only need git, jq and
# bash, all preinstalled on the runner.

on:
  push:
    branches: [main]
    paths:
      - 'skills/agent-rules/scripts/**'
      - 'skills/agent-rules/assets/**'
  pull_request:
    paths:
      - 'skills/agent-rules/scripts/**'
      - 'skills/agent-rules/assets/**'
  workflow_dispatch:

permissions: {}

jobs:
  script-tests:
    uses: netresearch/.github/.github/workflows/script-check.yml@main
    permissions:
      contents: read
    with:
      # Every test in the directory, discovered rather than listed. The
      # previous form named each script, so a test added later ran only on
      # the author's machine and CI stayed green without it — a test that
      # exists but never runs reads as coverage while enforcing nothing.
      check-cmd: >-
        for t in skills/agent-rules/scripts/tests/*.sh; do
          echo "── $t"; bash "$t" || exit 1;
        done
