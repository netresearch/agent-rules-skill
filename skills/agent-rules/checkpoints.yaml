# Checkpoints for AGENTS.md verification
# Ensures AGENTS.md exists, has proper structure, and stays accurate

version: 1
skill_id: agents

mechanical:
  # === FILE EXISTENCE ===
  - id: AG-01
    type: file_exists
    target: AGENTS.md
    severity: error
    desc: "AGENTS.md must exist in repository root"

  # === RECOMMENDED SECTIONS ===
  # Note: The agents.md spec has NO required fields - these are best practices
  #
  # Accepted heading spellings come from two sources inside this skill and
  # nowhere else: the equivalence table in scripts/validate-structure.sh
  # (check_scoped_sections) and the headings the two root templates emit
  # (assets/root-thin.md, assets/root-verbose.md). A spelling that is only
  # plausible is a finding, not an equivalent.
  - id: AG-02
    type: regex
    target: AGENTS.md
    pattern: "^#+ (.*Overview|Project|About)"
    severity: warning
    desc: "AGENTS.md should have an Overview/Project section (recommended but not required)"

  - id: AG-03
    type: regex
    target: AGENTS.md
    # Setup group of check_scoped_sections: Setup|Environment|Prerequisites|
    # Getting Started (its fifth member, "Workflow files", is a scoped
    # github-actions section that no root file carries).
    # "Development Workflow" removed: root-verbose.md:69 spells a branch/PR
    # sequence under that heading, not environment setup. AG-06 owns it.
    pattern: "^#+ (Setup|Getting Started|Prerequisites|Dev Environment|Environment)"
    severity: warning
    desc: "AGENTS.md should have Setup/Dev Environment section (recommended but not required)"

  - id: AG-04
    type: regex
    target: AGENTS.md
    pattern: "^#+ (Commands|Available Commands|Useful Commands)"
    severity: warning
    desc: "AGENTS.md should have Commands section"

  - id: AG-05
    type: regex
    target: AGENTS.md
    pattern: "^#+ (Architecture|Structure|Project Structure)"
    severity: warning
    desc: "AGENTS.md should describe project architecture"

  - id: AG-06
    type: regex
    target: AGENTS.md
    # "Workflow" added: root-thin.md:30 emits "## Workflow" as the development
    # workflow section, so the canonical thin output matched only via
    # "Contributing". "PR/Commit Checklist" is deliberately NOT accepted here —
    # check_scoped_sections keeps Checklist (PR|Commit|Checklist) as a group of
    # its own, separate from any workflow section.
    pattern: "^#+ (Development|Development Workflow|Contributing|Workflow)"
    severity: warning
    desc: "AGENTS.md should have Development workflow section"

  - id: AG-07
    type: regex
    target: AGENTS.md
    # Build/Tests group of check_scoped_sections:
    # Build|Tests|Running|Commands|Common patterns. "Commands" is where this
    # skill's own root templates and the assessed TYPO3 extensions put the test
    # commands, so a "## Commands" section satisfies this check. That makes
    # AG-07 overlap AG-04 on such files — the same shape AG-13 already has
    # against AG-04, and not this checkpoint's to resolve.
    pattern: "^#+ (Testing|Tests|Running Tests|Commands)"
    severity: warning
    desc: "AGENTS.md should have Testing section"

  # === FRESHNESS INDICATORS ===
  - id: AG-08
    type: regex
    target: AGENTS.md
    pattern: "(Last [Uu]pdated|Updated|Modified).*20[0-9]{2}"
    severity: warning
    desc: "AGENTS.md should have Last Updated date"

  # === STRUCTURE QUALITY ===
  - id: AG-09
    type: regex
    target: AGENTS.md
    pattern: "^## "
    severity: error
    desc: "AGENTS.md must use proper markdown heading structure"

  - id: AG-10
    type: regex
    target: AGENTS.md
    pattern: "```(bash|shell|sh|yaml|json|php|typescript|javascript)"
    severity: warning
    desc: "AGENTS.md should include code blocks with language hints"

  # === COMMAND DOCUMENTATION ===
  - id: AG-11
    type: regex
    target: AGENTS.md
    pattern: "(composer|npm|make|ddev|docker)"
    severity: warning
    desc: "AGENTS.md should document build/run commands"

  # === AGENT-OPTIMIZED SECTIONS ===
  - id: AG-13
    type: regex
    target: AGENTS.md
    pattern: '^#+ Commands( \(verified[^)]*\))?'
    severity: warning
    desc: "AGENTS.md should have Commands section (optionally with '(verified)' or '(verified DATE)' suffix for trust scoring)"

  - id: AG-14
    type: regex
    target: AGENTS.md
    pattern: "^#+ File Map"
    severity: info
    desc: "AGENTS.md should have File Map for navigation efficiency"

  - id: AG-15
    type: regex
    target: AGENTS.md
    pattern: "^#+ (Golden Samples|Canonical Patterns)"
    severity: info
    desc: "AGENTS.md should have Golden Samples to reduce pattern guessing"

  - id: AG-16
    type: regex
    target: AGENTS.md
    pattern: "^#+ (Utilities|Shared Utilities|Don't Reinvent)"
    severity: info
    desc: "AGENTS.md should list utilities to prevent duplicate code"

  - id: AG-17
    type: regex
    target: AGENTS.md
    pattern: "^#+ (Heuristics|Quick Decisions|Decision Rules)"
    severity: info
    desc: "AGENTS.md should have Heuristics for autonomous decisions"

  - id: AG-18
    type: regex
    target: AGENTS.md
    pattern: "Last verified.*20[0-9]{2}"
    severity: info
    desc: "AGENTS.md should have 'Last verified' timestamp for trust scoring"

  # === OUTPUT QUALITY ===
  - id: AG-19
    type: regex_not
    target: AGENTS.md
    pattern: "\\{\\{[A-Z][A-Z0-9_]*\\}\\}"
    severity: error
    desc: "AGENTS.md must not contain unresolved placeholders like {{PLACEHOLDER}}"

  - id: AG-20
    type: regex_not
    target: AGENTS.md
    pattern: "\\{\\{[A-Z_]+\\}\\}"
    severity: error
    desc: "AGENTS.md has unresolved template placeholders - regenerate or fix template"

  # === IMPORTANT CONTEXT ===
  - id: AG-12
    type: regex
    target: AGENTS.md
    # "Boundaries" added: it is this skill's canonical name for the section
    # (assets/root-thin.md:80, assets/root-verbose.md:28, and the Root File
    # table in references/output-structure.md — "Boundaries | Always/Ask/Never
    # rules"). Without it the check failed against both of the skill's own root
    # templates while no template ever emits any of the six original spellings.
    pattern: "^#+ (Critical|Constraints|Critical Constraints|Important|Caveats|Warnings|Boundaries)"
    severity: info
    desc: "AGENTS.md should have Critical/Constraints section for important warnings"

  # === POINTER PRINCIPLE ===
  - id: AG-26
    type: regex
    target: AGENTS.md
    pattern: "(see |refer to |defined in |located at )[`/]"
    severity: info
    desc: "AGENTS.md should point to files rather than duplicating content (Pointer Principle)"

  # === LANGUAGE ===
  - id: AG-27
    type: regex
    target: AGENTS.md
    pattern: "^# "
    severity: error
    desc: "AGENTS.md must have a top-level heading in English (default language)"

  # === GIT HOOKS ===
  - id: AG-29
    type: command
    # Was type "file_exists_any" with a "paths:" list. Neither is a runner type
    # nor a runner key, so the runner reported this checkpoint as SKIPPED
    # ("Unknown checkpoint type") on every project and it never measured
    # anything. The same five markers as one allowlisted `test`. The four
    # frameworks are those in references/git-hooks-setup.md; the husky marker
    # stays the installed hook, not the bare `.husky/` directory that doc names.
    pattern: "test -f lefthook.yml -o -f .lefthook.yml -o -f captainhook.json -o -f .husky/pre-commit -o -f .pre-commit-config.yaml"
    severity: warning
    desc: "Repository should have a git hooks framework configured (lefthook, captainhook, husky or pre-commit)"

  # === CLAUDE CODE COMPATIBILITY ===
  - id: AG-31
    type: script
    severity: warning
    desc: "CLAUDE.md must exist when Claude Code environment detected (.claude/ directory present)"
    # Was type "conditional" with "check_command:" — neither is read by the
    # runner, so this reported SKIPPED everywhere. The old body was also
    # inverted: `test -d .claude && test -f CLAUDE.md` FAILS when .claude/ is
    # absent, which is exactly when the rule does not apply. An `if` with no
    # else exits 0 in that case, so a repo without .claude/ passes.
    command: |
      if test -d .claude
      then
        test -f CLAUDE.md
      fi
    tags: [claude-code, compatibility]

  # === SCOPED AGENTS.MD ===
  - id: AG-28
    type: regex
    target: AGENTS.md
    pattern: "\\|.*\\|"
    severity: info
    desc: "AGENTS.md should use tables for structured data (Structured over Prose principle)"

llm_reviews:
  # === ACCURACY VERIFICATION ===
  - id: AG-25
    domain: repo-health
    prompt: |
      Verify that AGENTS.md accurately describes the actual project:
      1. Check if mentioned files/directories actually exist
      2. Verify mentioned commands work (check package.json scripts, composer.json scripts, Makefile targets)
      3. Confirm the architecture description matches the actual codebase structure
      4. Check for outdated version numbers or deprecated patterns

      Report specific inaccuracies with file paths and line numbers.
    severity: error
    desc: "AGENTS.md content must match actual codebase"

  - id: AG-21
    domain: repo-health
    prompt: |
      Verify the Commands section is accurate:
      1. Cross-reference with package.json "scripts", composer.json "scripts", or Makefile
      2. Check that documented test commands exist
      3. Verify build/install commands are correct
      4. Look for undocumented important commands

      List any commands that are documented but don't exist, or important commands that aren't documented.
    severity: warning
    desc: "Commands section must match actual available commands"

  - id: AG-22
    domain: repo-health
    prompt: |
      Check AGENTS.md for staleness indicators:
      1. Are version numbers current? (PHP versions, Node versions, etc.)
      2. Do mentioned dependencies match package.json/composer.json?
      3. Are CI/CD references up to date with actual workflow files?
      4. Is the "Last Updated" date recent (within last 3 months)?

      Report any outdated information with specific details.
    severity: warning
    desc: "AGENTS.md should be kept current with codebase changes"

  - id: AG-23
    domain: repo-health
    prompt: |
      Evaluate AGENTS.md completeness for AI agent usage:
      1. Does it explain the project purpose clearly?
      2. Does it describe key entry points for understanding the code?
      3. Are there warnings about gotchas or non-obvious behavior?
      4. Does it explain test conventions and how to run tests?
      5. Does it mention important environment variables?

      Rate completeness and list missing information that would help an AI agent.
    severity: info
    desc: "AGENTS.md should provide comprehensive context for AI agents"

  - id: AG-24
    domain: repo-health
    prompt: |
      Check for drift between AGENTS.md and other documentation:
      1. Compare with README.md - are they consistent?
      2. Check against CONTRIBUTING.md if it exists
      3. Verify consistency with inline code documentation
      4. Look for contradictions between AGENTS.md and actual configs

      Report any inconsistencies or contradictions found.
    severity: warning
    desc: "AGENTS.md must be consistent with other documentation"

  - id: AG-30
    domain: repo-health
    prompt: |
      Check if git hooks are properly configured and cover key quality gates:
      1. Is a hook framework present (lefthook.yml, captainhook.json, .husky/, .pre-commit-config.yaml)?
      2. Do hooks cover at minimum: linting/formatting and commit message validation?
      3. Are hook configs consistent with CI checks (e.g., same linters run locally and in CI)?
      4. If no hooks exist, flag this as a gap and recommend adding them.

      Report which hooks are configured, what they cover, and any gaps.
    severity: warning
    desc: "Repository should have git hooks covering linting, formatting, and commit validation"
